# SQL Server (konteyner) TLS ayarı (Pilot Faz A). Sertifika/anahtar deploy/scripts/make-sql-cert.sh ile üretilir ve /var/opt/mssql/certs içine salt okunur bağlanır.
# forceencryption=1: şifresiz bağlantı kabul edilmez. API/ops bağlantıları sertifikayı özel CA ile DOĞRULAR (TrustServerCertificate yok).
[network]
tlscert = /var/opt/mssql/certs/server.crt
tlskey = /var/opt/mssql/certs/server.key
tlsprotocols = 1.2
forceencryption = 1

[sqlagent]
enabled = false

[telemetry]
customerfeedback = false
