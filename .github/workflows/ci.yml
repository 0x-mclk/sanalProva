name: CI

# Sanal Prova CI. Gizli (GitHub secret) kullanmaz: SQL Server/uygulama parolalari her kosuda rastgele uretilir (scripts/compose-env.sh) ve maskelenir.
# Gercek AI cagrisi yoktur: mock saglayici, ucretli cagrilar kapali, API anahtarlari bos.
# Gizli degerler gunluklere/artifact'lara yazilmaz: gunlukler scripts/ci/compose-diagnostics.sh ile arindirilir, artifact klasorleri
# scripts/ci/scrub-artifacts.sh ile taranip gizli deger iceren dosyalar silinir; Playwright trace'i CI'da kapalidir.
#
# Is sirasi: backend + frontend + image-worker + compose-smoke (paralel, hizli) -> integration (backend + compose-smoke) ve e2e (hepsi).
# Smoke dusurse pahali isler baslamaz (Actions dakikasi korunur).

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ayni dal/PR icin eski kosu iptal edilir; elle (workflow_dispatch) ve push kosulari ayri gruplanir
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  Generation__Budget__AllowPaidCalls: "false"
  Ai__Fal__ApiKey: " "
  Ai__Pruna__ApiKey: " "
  Ai__Fashn__ApiKey: " "
  Ai__Gemini__ApiKey: " "

jobs:
  backend:
    name: Backend (build + birim testleri)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derle (TreatWarningsAsErrors)
        run: dotnet build SanalProva.slnx -c Release
      - name: Birim testleri
        run: dotnet test --project tests/SanalProva.UnitTests -c Release --no-build

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image-worker:
    name: Image-worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: image-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  compose-smoke:
    name: Docker Compose smoke (SQL Server, migration, API, image-worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rastgele parolalarla .env uret (yazdirilmaz)
        run: bash scripts/compose-env.sh
      - name: Compose yapilandirmasi gecerli mi (cikti yazdirilmaz, enterpolasyonlu parolalar icerir)
        run: docker compose config --quiet
      - name: Yigini baslat (sqlserver, db-provision, db-migrate, db-harden, image-worker, api)
        run: docker compose up -d --build api
      - name: API saglikli olana kadar bekle
        run: bash scripts/ci/wait-healthy.sh api
      - name: Smoke dogrulamalari
        run: bash scripts/ci/smoke-assert.sh
      - name: Arindirilmis compose gunlukleri (basarisizlikta)
        if: failure()
        run: bash scripts/ci/compose-diagnostics.sh compose-logs.txt
      - name: Arindirilmis gunlugu yukle (basarisizlikta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-logs
          path: compose-logs.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: Yigini ve birimleri sil
        if: always()
        run: docker compose down -v

  integration:
    name: MSSQL entegrasyon testleri (Docker Compose)
    needs: [backend, compose-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Rastgele parolalarla .env uret (yazdirilmaz)
        run: bash scripts/compose-env.sh
      - name: Yigini baslat (sqlserver, provision, migrate, harden, image-worker, api)
        run: docker compose up -d --build api
      - name: API saglikli olana kadar bekle
        run: bash scripts/ci/wait-healthy.sh api
      - name: Entegrasyon testleri (yalnizca sanalprova_test; migration laboratuvari testleri atlanir)
        working-directory: backend
        env:
          SANALPROVA_TEST_DB: Server=127.0.0.1,14331;Database=sanalprova_test;User ID=sanalprova_app;Password=${{ env.SP_APP_PW }};Encrypt=True;TrustServerCertificate=True
          SANALPROVA_TEST_DB_MIGRATOR: Server=127.0.0.1,14331;Database=sanalprova_test;User ID=sanalprova_migrator;Password=${{ env.SP_MIGRATOR_PW }};Encrypt=True;TrustServerCertificate=True
        run: dotnet test --project tests/SanalProva.IntegrationTests -c Release
      - name: Arindirilmis compose gunlukleri (basarisizlikta)
        if: failure()
        run: bash scripts/ci/compose-diagnostics.sh compose-logs.txt
      - name: Arindirilmis gunlugu yukle (basarisizlikta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-compose-logs
          path: compose-logs.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: Yigini ve birimleri sil
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright E2E (izole sanalprova_e2e)
    needs: [backend, frontend, compose-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rastgele parolalarla .env uret (yazdirilmaz)
        run: bash scripts/compose-env.sh
      - name: SQL Server + sema + sertlestirme (db-harden bagimliliklariyla on planda calisir)
        run: docker compose run -T --rm db-harden
      - name: sqlcmd kur (E2E tohum ve dogrulama sorgulari icin)
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - name: E2E ortami (rastgele parola, gecici depo)
        run: |
          pw="Aa1$(openssl rand -hex 12)"
          echo "::add-mask::$pw"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e2e-storage"
      - name: API'yi derle (webServer baslatma suresini kisaltir)
        run: dotnet build backend/src/SanalProva.Api -c Debug
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright testleri (CI'da trace kapali, giris istegindeki parolayi icerebilir)
        working-directory: frontend
        env:
          SANALPROVA_E2E_DB: Server=127.0.0.1,14331;Database=sanalprova_e2e;User ID=sanalprova_app;Password=${{ env.SP_APP_PW }};Encrypt=True;TrustServerCertificate=True
          SANALPROVA_E2E_STORAGE: ${{ runner.temp }}/e2e-storage
          SANALPROVA_E2E_SIGNING_KEY: ${{ env.STORAGE_SIGNING_KEY }}
          SANALPROVA_E2E_SETUP_TOKEN_KEY: ${{ env.SETUP_TOKEN_KEY }}
        run: npx playwright test
      - name: Artifact klasorunu gizli deger icin tara (iceren dosyalar silinir)
        if: failure()
        run: bash scripts/ci/scrub-artifacts.sh frontend/test-results
      - name: Basarisizlik ciktilari (ekran goruntusu/video; yalnizca sentetik veri)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results
          retention-days: 3
          if-no-files-found: ignore
      - name: Arindirilmis compose gunlukleri (basarisizlikta)
        if: failure()
        run: bash scripts/ci/compose-diagnostics.sh compose-logs.txt
      - name: Arindirilmis gunlugu yukle (basarisizlikta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: compose-logs.txt
          retention-days: 3
          if-no-files-found: ignore
      - name: Yigini ve birimleri sil
        if: always()
        run: docker compose down -v
