name: CI

# Sanal Prova CI. Gizli değer kullanmaz: SQL Server/uygulama parolaları her koşuda rastgele üretilir (scripts/compose-env.sh) ve maskelenir.
# Gerçek AI çağrısı yoktur: mock sağlayıcı, ücretli çağrılar kapalı, API anahtarları boş.

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  Generation__Budget__AllowPaidCalls: "false"
  Ai__Fal__ApiKey: " "
  Ai__Pruna__ApiKey: " "
  Ai__Fashn__ApiKey: " "
  Ai__Gemini__ApiKey: " "

jobs:
  backend:
    name: Backend (build + birim testleri)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derle (TreatWarningsAsErrors)
        run: dotnet build SanalProva.slnx -c Release
      - name: Birim testleri
        run: dotnet test --project tests/SanalProva.UnitTests -c Release --no-build

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image-worker:
    name: Image-worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: image-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  integration:
    name: MSSQL entegrasyon testleri (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Rastgele parolalarla .env üret (yazdırılmaz)
        run: scripts/compose-env.sh
      - name: Yığını başlat (sqlserver → provision → migrate → harden → image-worker → api)
        run: docker compose up -d --build api
      - name: API sağlıklı olana kadar bekle
        run: |
          for i in $(seq 1 120); do
            cid="$(docker compose ps -q api)"
            status="none"
            if [ -n "$cid" ]; then status="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"; fi
            if [ "$status" = healthy ]; then break; fi
            sleep 5
          done
          echo "api sağlık durumu: $status"
          [ "$status" = healthy ]
      - name: API hazır mı (veritabanı + depolama + görsel servis)
        run: curl -fsS http://127.0.0.1:8080/health/ready
      - name: Entegrasyon testleri (yalnızca sanalprova_test; migration laboratuvarı testleri atlanır)
        working-directory: backend
        env:
          SANALPROVA_TEST_DB: Server=127.0.0.1,14331;Database=sanalprova_test;User ID=sanalprova_app;Password=${{ env.SP_APP_PW }};Encrypt=True;TrustServerCertificate=True
          SANALPROVA_TEST_DB_MIGRATOR: Server=127.0.0.1,14331;Database=sanalprova_test;User ID=sanalprova_migrator;Password=${{ env.SP_MIGRATOR_PW }};Encrypt=True;TrustServerCertificate=True
        run: dotnet test --project tests/SanalProva.IntegrationTests -c Release
      - name: Compose günlükleri (başarısızlıkta)
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Yığını ve birimleri sil
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright E2E (izole sanalprova_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rastgele parolalarla .env üret (yazdırılmaz)
        run: scripts/compose-env.sh
      - name: SQL Server + şema + sertleştirme (db-harden bağımlılıklarıyla ön planda çalışır)
        run: docker compose run --rm db-harden
      - name: sqlcmd kur (E2E tohum ve doğrulama sorguları için)
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - name: E2E ortamı (rastgele parola, geçici depo)
        run: |
          pw="Aa1$(openssl rand -hex 12)"
          echo "::add-mask::$pw"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e2e-storage"
      - name: API'yi derle (webServer başlatma süresini kısaltır)
        run: dotnet build backend/src/SanalProva.Api -c Debug
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright testleri
        working-directory: frontend
        env:
          SANALPROVA_E2E_DB: Server=127.0.0.1,14331;Database=sanalprova_e2e;User ID=sanalprova_app;Password=${{ env.SP_APP_PW }};Encrypt=True;TrustServerCertificate=True
          SANALPROVA_E2E_STORAGE: ${{ runner.temp }}/e2e-storage
          SANALPROVA_E2E_SIGNING_KEY: ${{ env.STORAGE_SIGNING_KEY }}
        run: npx playwright test
      - name: Başarısızlık çıktıları (trace/video/ekran görüntüsü; yalnızca sentetik veri)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results
          retention-days: 3
          if-no-files-found: ignore
      - name: Compose günlükleri (başarısızlıkta)
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Yığını ve birimleri sil
        if: always()
        run: docker compose down -v
